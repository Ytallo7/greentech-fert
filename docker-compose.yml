version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: greentech_db
    environment:
      POSTGRES_USER: green_user
      POSTGRES_PASSWORD: green123
      POSTGRES_DB: greentech_fert_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: greentech_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@greentech.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
  
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: greentech_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 200
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: greentech_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1


volumes:
  pgdata: