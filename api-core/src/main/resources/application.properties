spring.application.name=api-core
# Configuração de Conexão com o PostgreSQL (Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/greentech_fert_db
spring.datasource.username=green_user
spring.datasource.password=green_password

# O Spring vai criar as tabelas no banco de dados automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Mostra no terminal os comandos SQL que o Spring está executando (bom para debugar)
spring.jpa.show-sql=true